<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiniTikZ2Wasm</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header>
      <h1>MiniTikZ2Wasm</h1>
    </header>
    <main>
      <div id="example-buttons"></div>
      <div class="columns">
        <section class="panel">
          <textarea id="source" spellcheck="false"></textarea>
          <button id="run">Submit</button>
        </section>
        <section class="panel">
          <canvas id="canvas" width="400" height="400"></canvas>
          <pre id="error-log" hidden></pre>
        </section>
      </div>
      <div id="steps"></div>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
