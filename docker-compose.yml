services:
  app:
    build:
      context: .
      dockerfile: web-be/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    # volumes:
    #   - ./web-fe:/app/web-fe:ro
