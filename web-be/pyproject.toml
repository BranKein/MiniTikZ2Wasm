[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "web-be"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "mini-tikz-2-wasm"]

[tool.uv.sources]
mini-tikz-2-wasm = { workspace = true }

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
